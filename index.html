<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Galaxy Map</title>

<style>

body{
margin:0;
overflow:hidden;
background:#020817;
font-family:Arial;
color:white;
}

/* MAP */

#mapContainer{
position:absolute;
width:100vw;
height:100vh;
overflow:hidden;
touch-action:none;
}

#map{
position:absolute;
transform-origin:0 0;
}

/* GRID */

.grid{
position:absolute;
width:6000px;
height:6000px;

background-image:
linear-gradient(rgba(80,120,255,0.15) 1px, transparent 1px),
linear-gradient(90deg, rgba(80,120,255,0.15) 1px, transparent 1px);

background-size:200px 200px;
}

/* ROUTES */

.route-line{
stroke:rgba(0,170,255,0.35);
stroke-width:1.2;
}

/* PLANETS */

.planet{
position:absolute;
width:10px;
height:10px;

border-radius:50%;
background:#7cc6ff;

box-shadow:
0 0 10px rgba(0,170,255,0.8),
0 0 20px rgba(0,170,255,0.5);

cursor:pointer;
transform:translate(-50%,-50%);
}

.planet:hover{
transform:translate(-50%,-50%) scale(1.4);
}

/* LABEL */

.label{
position:absolute;
transform:translate(-50%,8px);

background:rgba(0,0,0,0.7);
padding:3px 8px;

border-radius:6px;
font-size:12px;
white-space:nowrap;
}

/* INFO PANEL */

#info{
position:fixed;
right:15px;
bottom:15px;

background:rgba(0,0,0,0.8);
padding:14px;

border-radius:10px;

width:220px;
}

#info h3{
margin-top:0;
}

/* CAPITAL SHIPS */

.capital-orbit{
position:absolute;
left:50%;
top:50%;

width:0;
height:0;

transform-origin:center;
animation:orbit 20s linear infinite;
}

.capital-offset{
position:absolute;
transform:translateX(42px);
}

.capital-ship{
width:34px;

transform:translate(-50%,-50%) rotate(90deg);
animation:counterOrbit 20s linear infinite;

pointer-events:none;

filter:
drop-shadow(0 0 6px rgba(0,170,255,.7))
drop-shadow(0 0 16px rgba(0,170,255,.4));
}

/* animations */

@keyframes orbit{
from{transform:rotate(0deg);}
to{transform:rotate(360deg);}
}

@keyframes counterOrbit{
from{transform:translate(-50%,-50%) rotate(90deg) rotate(0deg);}
to{transform:translate(-50%,-50%) rotate(90deg) rotate(-360deg);}
}

</style>
</head>

<body>

<div id="mapContainer">

<div id="map">

<div class="grid"></div>

<svg id="routes" width="6000" height="6000"></svg>

<div id="planets"></div>

</div>
</div>

<div id="info">
<h3 id="planetName">Planet</h3>
<div id="patrolNames">Patrol: none</div>
</div>

<script>

/* PLANETS DATA */

const planets = [

{name:"Ilum",x:700,y:900,patrol:["Alpha","Beta"]},
{name:"Exegol",x:500,y:850,patrol:["Gamma"]},

{name:"Bogano",x:2400,y:600,patrol:["Delta"]},
{name:"Dantooine",x:2400,y:700,patrol:["Echo"]},

{name:"Coruscant",x:2300,y:1300,patrol:["Sentinel"]},
{name:"Tython",x:2100,y:1350,patrol:["Sentinel"]},

{name:"Kuat",x:2600,y:1400,patrol:["Fleet"]},

{name:"Zios",x:3200,y:700,patrol:["Guard"]},
{name:"Korriban",x:3100,y:800,patrol:["Guard"]},
{name:"Felucia",x:3300,y:900,patrol:["Guard"]},

{name:"Trandosha",x:3500,y:1900,patrol:["Watch"]},

{name:"Kamino",x:3800,y:2200,patrol:["Defense"]},
{name:"Geonosis",x:3600,y:2250,patrol:["Defense"]},
{name:"Tatooine",x:3500,y:2350,patrol:["Defense"]},

{name:"Tanallorr",x:900,y:2700,patrol:["Hidden"]},
{name:"Hoth",x:1300,y:2500,patrol:["Echo"]},
{name:"Takodana",x:1100,y:2300,patrol:["Echo"]}

];


/* ROUTES */

const routes = [

["Ilum","Exegol"],

["Bogano","Dantooine"],

["Coruscant","Kuat"],
["Coruscant","Tython"],

["Zios","Korriban"],
["Zios","Felucia"],

["Geonosis","Kamino"],
["Geonosis","Tatooine"],

["Tanallorr","Hoth"],
["Hoth","Takodana"]

];


/* MAP */

const planetContainer = document.getElementById("planets");
const routeSVG = document.getElementById("routes");

/* create planets */

const planetIndex={};

planets.forEach(p=>{

const el=document.createElement("div");
el.className="planet";

el.style.left=p.x+"px";
el.style.top=p.y+"px";

planetContainer.appendChild(el);

const label=document.createElement("div");
label.className="label";
label.innerText=p.name;

label.style.left=p.x+"px";
label.style.top=p.y+"px";

planetContainer.appendChild(label);

planetIndex[p.name]=p;

/* info click */

el.onclick=()=>{

document.getElementById("planetName").innerText=p.name;
document.getElementById("patrolNames").innerText="Patrol: "+p.patrol.join(", ");

};

/* ships */

createShips(el,3);

});


/* ROUTES DRAW */

routes.forEach(r=>{

const a=planetIndex[r[0]];
const b=planetIndex[r[1]];

const line=document.createElementNS("http://www.w3.org/2000/svg","line");

line.setAttribute("x1",a.x);
line.setAttribute("y1",a.y);
line.setAttribute("x2",b.x);
line.setAttribute("y2",b.y);

line.setAttribute("class","route-line");

routeSVG.appendChild(line);

});


/* SHIPS */

function createShips(planet,count){

for(let i=0;i<count;i++){

const orbit=document.createElement("div");
orbit.className="capital-orbit";

orbit.style.animationDelay=(-i*3)+"s";

const offset=document.createElement("div");
offset.className="capital-offset";

const ship=document.createElement("img");
ship.src="https://i.imgur.com/7Q9Z1Zm.png";
ship.className="capital-ship";

offset.appendChild(ship);
orbit.appendChild(offset);
planet.appendChild(orbit);

}

}


/* ZOOM + PAN */

const map=document.getElementById("map");

let scale=1;
let posX=0;
let posY=0;

mapContainer.onwheel=(e)=>{

e.preventDefault();

const zoom=e.deltaY<0?1.1:0.9;

scale*=zoom;

map.style.transform=`translate(${posX}px,${posY}px) scale(${scale})`;

};

let dragging=false;
let lastX,lastY;

mapContainer.onmousedown=e=>{
dragging=true;
lastX=e.clientX;
lastY=e.clientY;
};

mapContainer.onmouseup=()=>dragging=false;

mapContainer.onmousemove=e=>{

if(!dragging)return;

posX+=e.clientX-lastX;
posY+=e.clientY-lastY;

lastX=e.clientX;
lastY=e.clientY;

map.style.transform=`translate(${posX}px,${posY}px) scale(${scale})`;

};

</script>

</body>
</html>
